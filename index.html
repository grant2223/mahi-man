<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0B6B4F" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="icon" href="/favicon-64.png" type="image/png" sizes="64x64" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Mahi Man" />
    <meta name="description" content="Get the help you need within minutes. Odd jobs done by locals, fast." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300;12..96,400;12..96,500;12..96,600&display=swap" rel="stylesheet" />
    <title>Mahi Man</title>
    <!-- Share cards: /api/og picks one of the two designs each time a link is shared.
         No og:url on purpose: gift (/g/) and worker code (/w/) links must keep their own address when shared. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Mahi Man" />
    <meta property="og:title" content="Mahi Man: Get the help you need within minutes" />
    <meta property="og:description" content="Odd jobs done by locals, fast." />
    <meta property="og:image" content="https://mahiman.app/api/og" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Mahi Man. Get the help you need within minutes." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Mahi Man: Get the help you need within minutes" />
    <meta name="twitter:description" content="Odd jobs done by locals, fast." />
    <meta name="twitter:image" content="https://mahiman.app/api/og" />
  </head>
  <body>
    <!-- Splash: shows in the app only, the moment it opens, for 3 seconds, then fades into the app. -->
    <style>
      #splash{position:fixed;inset:0;z-index:9999;overflow:hidden;color:#fff;font-family:"Bricolage Grotesque",system-ui,sans-serif;background:radial-gradient(120% 90% at 85% 0%,#1a9c72 0%,#0b6b4f 50%,#064230 100%);transition:opacity .4s ease}
      #splash.out{opacity:0}
      #splash .sp-w{position:absolute;left:0;right:0;top:22%;text-align:center;padding:0 24px}
      #splash .sp-w b{display:block;font-size:52px;font-weight:600;letter-spacing:-1.8px;line-height:1;opacity:0;transform:translateY(14px);animation:spUp .6s cubic-bezier(.2,.8,.2,1) .15s forwards}
      #splash .sp-w span{display:block;margin-top:12px;font-size:18px;font-weight:300;color:rgba(255,255,255,.88);opacity:0;transform:translateY(10px);animation:spUp .6s cubic-bezier(.2,.8,.2,1) .35s forwards}
      #splash img{position:absolute;left:50%;bottom:-6px;width:min(330px,86vw);transform:translate(-50%,105%);transform-origin:50% 100%;animation:spRise .8s cubic-bezier(.3,1.35,.5,1) .45s forwards,spNod .5s ease-in-out 1.5s}
      @keyframes spUp{to{opacity:1;transform:none}}
      @keyframes spRise{to{transform:translate(-50%,0)}}
      @keyframes spNod{0%{transform:translate(-50%,0) rotate(0)}40%{transform:translate(-50%,-6px) rotate(-3deg)}100%{transform:translate(-50%,0) rotate(0)}}
      @media (prefers-reduced-motion:reduce){#splash .sp-w b,#splash .sp-w span{animation:none;opacity:1;transform:none}#splash img{animation:none;transform:translate(-50%,0)}}
    </style>
    <div id="splash" hidden><div class="sp-w"><b>Mahi Man</b><span>Get the help you need within minutes.</span></div><img src="/mascot.png" alt="" /></div>
    <script>
      (function () {
        var app = !!(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform())
          || location.protocol === "capacitor:" || /[?&]splash=1/.test(location.search);
        var el = document.getElementById("splash");
        if (!app) { el.remove(); return; }
        el.hidden = false;
        setTimeout(function () { el.classList.add("out"); }, 2600);
        setTimeout(function () { el.remove(); }, 3000);
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
